apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: todo-minikube
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/bolshestas/test-infra-gitops
    targetRevision: main
    path: apps/todo/overlays/minikube

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
